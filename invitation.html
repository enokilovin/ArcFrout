<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico">
    <title>Invitation!</title>
    <style>
        body { 
            font-family: 'Times New Roman', serif; 
            text-align: center; 
            padding: 80px 10px; 
            color: #fff; 
            margin: 0;
        }
        .container { 
            max-width: 420px; 
            margin: 0 auto; 
            font-size: 1.2rem;
            color: #333;
            line-height: 2;
        }
        .quiz-box { 
            background: linear-gradient(135deg, #444, #000);
            padding: 40px 10px; 
            margin: 25px 0; 
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.5em;
            border-radius: 6px;
            overflow-x: auto;
        }
        .input-area { 
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        input[type="number"] { 
            width: 90px; 
            padding: 12px; 
            font-size: 1rem; 
            border-radius: 6px; 
            border: 2px solid #ddd; 
            text-align: center; 
            outline: none;
        }
        input[type="number"]:focus {
            border-color: #666;
        }
        button { 
            padding: 0 24px; 
            font-size: 1rem; 
            background: linear-gradient(135deg, #78f, #56f); 
            color: #fff; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: all 0.2s;
        }
        button:hover { 
            background: linear-gradient(135deg, #56f, #34f);
        }
        .hidden { 
            display: none; 
        }
        .error-msg { 
            color: #f56; 
            font-size: 0.9rem; 
            margin-top: 18px; 
            font-weight: bold;
        }
        .success-msg {
            color: #56F; 
            font-weight: bold; 
            font-size: 1.3rem;
            letter-spacing: 0.05rem;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <p id="desc">To block spam bots, please count the letters below and enter the number.（文字数を数えて入力してください。）</p>
    
    <div id="quiz-area">
        <div class="quiz-box">
            <p>REDSTONE</p>
        </div>
        <div class="input-area">
            <input type="number" id="answer" placeholder="Number" min="0" max="99">
            <button onclick="checkAnswer()">Enter</button>
        </div>
        <p id="error" class="error-msg hidden">Please enter the correct number.（再入力してください。）</p>
    </div>

    <div id="link-area" class="hidden">
        <p class="success-msg">✨ Redirecting to Discord...</p>
    </div>
</div>

<script>
function checkAnswer() {
    const input = document.getElementById('answer');
    const errorMsg = document.getElementById('error');
    
    if (input.value === '8') {
        errorMsg.classList.add('hidden');
        document.getElementById('quiz-area').classList.add('hidden');
        document.getElementById('desc').classList.add('hidden');
        document.getElementById('link-area').classList.remove('hidden');

        const code = "GaNPpqv"; 
        window.location.href = "https://" + "discord." + "gg/" + code;
    } else {
        errorMsg.classList.remove('hidden');
        input.value = '';
        input.focus();
    }
}
document.getElementById('answer').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkAnswer();
});
</script>
</body>
</html>
